<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d12" />
  <title>Gpyth Chat — Global Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="app-page chat-page">

  <header class="topbar">
    <div class="topbar-left">
      <a href="home.html" class="back-btn">←</a>
      <span class="brand">Global Chat</span>
    </div>
    <div class="topbar-right">
      <span class="my-id" id="myId">----</span>
    </div>
  </header>

  <main class="chat-messages" id="chatMessages">
    <div class="empty-state" id="emptyChat" style="display:none;">
      Belum ada pesan. Mulai ngobrol! 💬
    </div>
  </main>

  <form class="chat-input-bar" id="chatForm" autocomplete="off">
    <input
      type="text"
      id="chatInput"
      class="chat-input"
      placeholder="Ketik pesan..."
      maxlength="500"
      autocomplete="off" />
    <button type="submit" class="chat-send" id="chatSend">➤</button>
  </form>

  <script type="module" src="app.js"></script>
</body>
</html>
